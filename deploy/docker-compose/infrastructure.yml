version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0.32
    container_name: zenith-mall-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "000000"
      MYSQL_DATABASE: zenith_mall
      MYSQL_USER: zenith
      MYSQL_PASSWORD: "000000"
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      # 数据持久化
#      - mysql-data:/var/lib/mysql
      - G:/docker-env/zenith-mall/mysql/data:/var/lib/mysql
      - G:/docker-env/zenith-mall/mysql/log:/var/log/mysql
      # 初始化脚本
#      - ../../sql/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
#      - ../../sql/init/02-test-data.sql:/docker-entrypoint-initdb.d/02-test-data.sql:ro
      # MySQL 配置
#      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    command: >
      mysqld
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --lower_case_table_names=1
      --default-time-zone='+08:00'
      --max_connections=1000
      --max_connect_errors=1000
      --slow_query_log=1
      --long_query_time=2
#    command:
#      - --character-set-server=utf8mb4
#      - --collation-server=utf8mb4_unicode_ci
#      - --default-authentication-plugin=mysql_native_password
    networks:
      - zenith-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: zenith-mall-redis
    restart: always
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      # Redis 配置
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - zenith-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: zenith-mall-nginx
    restart: always
    environment:
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx 配置
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL 证书（如果需要）
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # 静态资源
      - ./nginx/html:/usr/share/nginx/html:ro
      # 日志
      - nginx-logs:/var/log/nginx
    networks:
      - zenith-network
    depends_on:
      - mysql
      - redis
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 可选：RabbitMQ 消息队列（用于异步处理、订单延迟取消等）
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: zenith-mall-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: zenith
      RABBITMQ_DEFAULT_PASS: zenith123456
      RABBITMQ_DEFAULT_VHOST: /
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"   # AMQP 协议端口
      - "15672:15672" # 管理界面端口
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - zenith-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 可选：Elasticsearch（用于商品搜索、日志分析）
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: zenith-mall-elasticsearch
    restart: always
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: false
      TZ: Asia/Shanghai
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - zenith-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

# 数据卷定义
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  nginx-logs:
    driver: local
  rabbitmq-data:
    driver: local
  elasticsearch-data:
    driver: local

# 网络定义
networks:
  zenith-network:
    driver: bridge
