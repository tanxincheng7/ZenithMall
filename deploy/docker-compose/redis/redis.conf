# Redis 配置文件

# 绑定地址
bind 0.0.0.0

# 端口
port 6379

# 守护进程模式（容器中不需要）
daemonize no

# 持久化配置
# RDB 持久化
save 900 1
save 300 10
save 60 10000

# AOF 持久化
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 数据库数量
databases 16

# 最大内存
maxmemory 256mb
maxmemory-policy allkeys-lru

# 密码（可选，生产环境建议启用）
# requirepass zenith123456

# 日志
loglevel notice
logfile ""

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128
